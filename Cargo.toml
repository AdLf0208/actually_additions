[package]
# Ported from: Actually Additions 1.3.26 (Ellpeck/ActuallyAdditions, MIT), Minecraft Java
# 1.21.1 NeoForge. Local-only until the maintainer approves publishing (ARCHITECTURE.md §8).
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "actuallyadditions"
version = "0.2.9"
edition = "2024"
license = "MIT"
description = "Actually Additions for Horizon: the Coal Generator, the Crusher, the Atomic Reconstructor, the crafting chain and the Black Quartz Ore"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build).
#
# This is the package's only dependency, and it must stay that way: the registry's native-subset
# checks (rule R9) refuse a package that declares anything else — and a package with a registry
# dependency cannot be published at all, so no `Cargo.lock` travels in the archive either.
# `src/runtime.rs` reads recipe JSON with its own reader (notes.md, "The registry's R9").
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
