# The only manifest and the only identity of this mod (mod API 0.2, SDK layout).
# Cargo's package name and version are not the mod's.
id = "actuallyadditions"
name = "Actually Additions"
version = "0.2.6"
description = """A port of Actually Additions 1.3.26 for Horizon, slices 1-5: the Coal Generator, the Crusher, the
state a broken machine keeps, the crafting chain's pieces, the Black Quartz Ore, and the Atomic
Reconstructor's laser conversion.
The generator turns any fuel the game's fuel table knows into 20 FE a tick, up to a 60,000 FE buffer that
takes no inserts and gives 80 FE a call, and a fuelled generator pushes its FE to the machines beside it.
The crusher spends 40 FE a tick and turns one input into its recipe's results in 100 ticks, reading the
jar's own `actuallyadditions:crushing` files, with the second result rolled at its chance. Both buffers
are real block energy capabilities another mod's cable can read. A broken machine keeps its FE,
burn and progress on its own item (and never its inventory, which spills as vanilla does).
The Iron Casing, the Basic Coil and the `c:cobblestones` tag make the Coal Generator's own recipe craft;
the Iron Casing's own recipe crafts from `c:ingots/iron`, `c:rods/wooden` and the Black Quartz the
world-generated ore drops (smelted, blasted or crushed).
The Atomic Reconstructor is a facing machine with a 300,000 CF buffer, a lens slot, a 100-tick cycle and
a ten-block beam: a 1,000 CF shot plus the converting recipe's own energy turns the blocks of the plane
it hits into their `actuallyadditions:laser` results (redstone dust into a Restonia Crystal, sands into
soul sand, a red mushroom into nether wart), and drops an item result at the block. The crystal closes
the chain: the Crusher's own recipe now crafts.
Not yet ported: the GUI, the Double Crusher and the other machines, redstone control, energy relays,
the Empowerer and the empowered crystals, the beam's item-entity half, the booklet."""
authors = ["Ellpeck", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside the carried assets/ and data/.
api = "0.2"
# "both" is the installation side: the machines run on the server, and single player's integrated
# server belongs to the client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); this mod declares three blocks and their block entities, so it is used, not just required.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
