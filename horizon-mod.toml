# The only manifest and the only identity of this mod (mod API 0.2, SDK layout).
# Cargo's package name and version are not the mod's.
id = "actuallyadditions"
name = "Actually Additions"
version = "0.2.12"
description = """A port of Actually Additions 1.3.26 for Horizon, slices 1-9: the Coal Generator, the Crusher, the
state a broken machine keeps, the crafting chain's pieces, the Black Quartz Ore, and the Atomic
Reconstructor's laser conversion — for blocks and for dropped items — with its redstone pulse mode.
The generator turns any fuel the game's fuel table knows into 20 FE a tick, up to a 60,000 FE buffer that
takes no inserts and gives 80 FE a call, and a fuelled generator pushes its FE to the machines beside it.
The crusher spends 40 FE a tick and turns one input into its recipe's results in 100 ticks, reading the
jar's own `actuallyadditions:crushing` files, with the second result rolled at its chance. Both buffers
are real block energy capabilities another mod's cable can read. A broken machine keeps its FE,
burn and progress on its own item (and never its inventory, which spills as vanilla does).
The Iron Casing, the Basic Coil and the `c:cobblestones` tag make the Coal Generator's own recipe craft;
the Iron Casing's own recipe crafts from `c:ingots/iron`, `c:rods/wooden` and the Black Quartz the
world-generated ore drops (smelted, blasted or crushed).
The Atomic Reconstructor is a facing machine with a 300,000 CF buffer, a lens slot, a 100-tick cycle and
a ten-block beam: a 1,000 CF shot plus the converting recipe's own energy turns the blocks of the plane
it hits into their `actuallyadditions:laser` results (redstone dust into a Restonia Crystal, sands into
soul sand, a red mushroom into nether wart), and drops an item result at the block. The same beam then
converts the dropped items in the box between the machine and the block it hit, as many of a stack as
its buffer pays for, marking each result so it is never converted twice — which is how rotten flesh
becomes leather and quartz a prismarine shard. The crystal closes the chain: the Crusher's own recipe
now crafts.
A redstone signal freezes the reconstructor's cycle; a click with the config's redstone configurator (a redstone torch by default) switches it to pulse mode, where one shot fires per rising edge and the cycle never free-runs, and the mode travels on the machine's broken item.
The four lens items of the jar's 5,000 CF laser ring ship with the `c:glass_blocks` tag and the lens crafting recipe: a right click puts a lens in the reconstructor's slot (the `info` line names it), an occupied slot refuses a second lens, and a dropped lens converts to the next one in the ring.
The miner lens now changes the beam itself: with it in the slot, the 1,000 CF shot's beam swaps the block it sights for a weighted-random ore from the jar's `actuallyadditions:mining_lens` table, paying the lens's own 60,000 CF, while the plain lens keeps the default conversion. The detonator lens sets off the same sourceless radius-10, fiery blast upstream does (`ExplosionInteraction.NONE`, which keeps blocks at this pin) for its own 250,000 CF, and its beam reaches thirty blocks; the killer and disenchanting lenses' own beam effects are distinct rule paths and are not ported yet.
Not yet ported: the GUI, the Double Crusher and the other machines, the rest of redstone control (only the reconstructor toggles), energy relays, the Empowerer and the empowered crystals, the killer/disenchanting lens effects, the booklet."""
authors = ["Ellpeck", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside the carried assets/ and data/.
api = "0.2"
# "both" is the installation side: the machines run on the server, and single player's integrated
# server belongs to the client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); this mod declares three blocks and their block entities, so it is used, not just required.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
